name: Release

on:
  push:
    tags: ['v*']
  # From main, for the version in mygo.json: the draft targets the commit
  # run, and publishing it creates the tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tag against app version
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Run the release from main" >&2
              exit 1
            fi
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')"
          else
            RELEASE_TAG="$REF_NAME"
          fi
          python3 scripts/release.py check-tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/universal
            target: darwin-universal
          - runner: ubuntu-latest
            platform: windows/amd64
            target: windows-amd64
          - runner: ubuntu-latest
            platform: windows/arm64
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - name: Build app
        run: go tool mygo build -platform "$BUILD_PLATFORM"
      - name: Package public assets
        run: python3 scripts/release.py package "$BUILD_TARGET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python3 scripts/release.py checksums
      - name: Create or update release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to change a published release"'
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            # A tag push has its tag; a manual run creates it on publish.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              where=(--target "$GITHUB_SHA")
            else
              where=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" dist/* "${where[@]}" --draft \
              --title "ABeast $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          fi
